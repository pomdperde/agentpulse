[project]
name = "agentpulse"
version = "0.2.0"
description = "多 Agent 的 Agent 领域热点检索与论文汇总系统"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
agentpulse = "agentpulse.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentpulse"]
